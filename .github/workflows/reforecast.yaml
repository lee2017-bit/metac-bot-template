name: Re-forecast closed questions (experiment)

# Post-close re-forecast experiment (user decision 11/20). Takes questions the
# live bot has forecast that have CLOSED, and runs the forecasting step again
# with other models on the research saved when the bot first forecast them.
# Nothing is posted (reforecast.py refuses every post call). Scored once the
# questions resolve. Own ledger and $25 cap, separate from the live bot.
on:
  workflow_dispatch:
    inputs:
      max_questions:
        description: "Questions per run"
        default: "15"
      provider:
        description: "oc = Nebius configs ($25 cap, used up: scoring only); anthropic = Claude configs (Ultra credit, own ledger, $33 counted cap, stops 11/27 22:30 UTC)"
        type: choice
        options: [oc, anthropic]
        default: oc
      run_cap:
        description: "Counted USD for this run"
        default: "5"
      include_open:
        description: "anthropic only: also open Fall questions (stored, never posted)"
        type: choice
        options: ["0", "1"]
        default: "0"
  schedule:
    - cron: "23 4 * * *" # daily, 13:23 KST

concurrency:
  group: reforecast
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to download the live bot's reports artifacts

jobs:
  reforecast:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # read-only: resolutions
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FORECAST_EFFORT: high
      PARSER_MODEL: anthropic/claude-haiku-5-5
      LLM_PROVIDER: openai_compat
      PARSER_MODEL_OC: zai-org/GLM-5.3-Flash
      FORECAST_CALL_TIMEOUT_OC: "300"
      # name=model:samples. A config is skipped where the posted forecast already
      # came from that model (it is then the posted forecast itself).
      # glm-5.3 dropped after run 44642389305 (17 of 45 samples failed: 529 overloaded / timeouts).
      # Claude configs (user decision 11/25, Ultra credit before it expires 11/28 09:00 KST): same
      # questions as the Nebius run (REFORECAST_SCOPE=state) plus, if asked, open Fall questions.
      # The posted forecast already is the live set-up (2 x Fable + 3 x Opus on the same research),
      # so Fable-only and Opus-only come from it for free.
      REFORECAST_CONFIGS: ${{ inputs.provider == 'anthropic' && 'claude-sonnet=claude|claude-sonnet-5-5:3,claude-opus-noresearch=claude-noresearch|claude-opus-5-5:2,claude-haiku=claude|claude-haiku-5-5:3' || 'kimi-k3=moonshotai/Kimi-K3:3,kimi-k3.1-pro=moonshotai/Kimi-K3.1-Pro:3,deepseek-flash=deepseek-ai/DeepSeek-V4.1-Flash-1017:3' }}
      REFORECAST_SCOPE: ${{ inputs.provider == 'anthropic' && 'state' || 'all' }}
      REFORECAST_INCLUDE_OPEN: ${{ inputs.provider == 'anthropic' && inputs.include_open || '0' }}
      REFORECAST_STOP_AT: ${{ inputs.provider == 'anthropic' && '2026-11-27T22:30:00Z' || '' }}
      # Kimi-K3.1-Pro's Nebius price could not be confirmed: count it at Kimi-K3's.
      OC_PRICES: '{"moonshotai/Kimi-K3.1-Pro": [3.0e-6, 15.0e-6]}'
      SPEND_LEDGER: ${{ inputs.provider == 'anthropic' && 'spend/ledger_exp_claude.json' || 'spend/ledger_exp.json' }}
      SPEND_CAP_USD: ${{ inputs.provider == 'anthropic' && '33' || '25' }} # Claude: counted, about $40 billed
      RUN_CAP_USD: ${{ inputs.run_cap || '5' }}
      SPEND_OFFSET_USD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      # The cache version is a hash of the path list: keep this list exactly as
      # it was when the Nebius runs saved their state, or none of it restores
      # (run 45627844861 found no cache after a third path was added). The
      # Claude ledger has a cache of its own.
      - name: Restore experiment state
        uses: actions/cache/restore@v4
        with:
          path: |
            spend/ledger_exp.json
            reforecast/results.jsonl
          key: reforecast-state-${{ github.run_id }}
          restore-keys: reforecast-state-
      - name: Restore Claude experiment ledger
        uses: actions/cache/restore@v4
        with:
          path: spend/ledger_exp_claude.json
          key: reforecast-claude-ledger-${{ github.run_id }}
          restore-keys: reforecast-claude-ledger-
      - name: Stop if the experiment state is missing
        if: inputs.provider == 'anthropic'
        run: |
          if [ ! -s reforecast/results.jsonl ]; then
            echo "reforecast/results.jsonl was not restored; refusing to run (nothing to re-forecast)"; exit 1
          fi
          echo "state: $(wc -l < reforecast/results.jsonl) lines"
      - name: Re-forecast closed questions
        run: uv run python reforecast.py run --max-questions ${{ inputs.max_questions || 15 }}
      - name: Score resolved questions
        if: always()
        run: |
          uv run python reforecast.py score || echo "scoring failed (exit $?)"
          [ -f reforecast/summary.md ] && cat reforecast/summary.md >> $GITHUB_STEP_SUMMARY || true
      - name: Save experiment state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            spend/ledger_exp.json
            reforecast/results.jsonl
          key: reforecast-state-${{ github.run_id }}
      - name: Save Claude experiment ledger
        if: always() && hashFiles('spend/ledger_exp_claude.json') != ''
        uses: actions/cache/save@v4
        with:
          path: spend/ledger_exp_claude.json
          key: reforecast-claude-ledger-${{ github.run_id }}
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reforecast-${{ github.run_id }}
          path: |
            reforecast/results.jsonl
            reforecast/summary.md
            spend/ledger_exp.json
            spend/ledger_exp_claude.json
          if-no-files-found: ignore
          retention-days: 90
