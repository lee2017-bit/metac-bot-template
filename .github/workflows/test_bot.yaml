name: Test Bot

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "anthropic (Claude) or openai_compat (Nebius)"
        type: choice
        options: [anthropic, openai_compat]
        default: anthropic
      profile:
        description: "MB = the MiniBench set-up used from 11/28 (3 x Opus, 5 searches, own cap)"
        type: choice
        options: ["", MB]
        default: ""

# Own group so a test can run while the forecast loop is running (sharing the
# loop's group would cancel one of the two). The test therefore does not write
# the spend ledger; its cost is added to SPEND_OFFSET_USD by hand afterwards.
concurrency:
  group: forecast-bot-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Restore spend ledger
        uses: actions/cache/restore@v4
        with:
          path: spend
          key: spend-ledger-${{ github.run_id }}
          restore-keys: spend-ledger-
      - name: Run bot
        run: uv run python main.py --mode test_questions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Spend cap across all runs (USD) and the date the Claude credit expires.
          # Bot-only cap. The organisation also has a Console monthly limit of $180 for all
          # usage (about $35 of it was spent before the bot existed), so the bot stops
          # a little before that limit would start rejecting calls.
          SPEND_CAP_USD: "140"
          RUN_CAP_USD: "15"
          LLM_KEY_EXPIRES: "2026-11-27T15:00:00Z" # = 11/28 00:00 KST
          # 5 forecasts per question: 2 x Fable 5.2 + 3 x Opus 5.5, high effort.
          FORECAST_ENSEMBLE: "claude-fable-5-2:2,claude-opus-5-5:3"
          FORECAST_EFFORT: high
          PARSER_MODEL: anthropic/claude-haiku-5-5
          RESEARCHER: claude-web-search
          RESEARCH_MODEL: claude-sonnet-5-5
          RESEARCH_EFFORT: high
          RESEARCH_MAX_SEARCHES: "6"
          RESEARCH_SEARCH_TOOL: web_search_20250305
          # Upgrades under test: full question context for the researcher, page
          # reading, prediction-market lookup, per-outcome discrete forecasts.
          RESEARCH_FULL_CONTEXT: "1"
          RESEARCH_MAX_FETCHES: "3"
          RESEARCH_MAX_MARKET_LOOKUPS: "2"
          DISCRETE_PER_VALUE_MAX: "35"
          SPEND_OFFSET_USD: "28.3" # 9.6 tests outside the ledger + 12.7 gap vs Console on 11/18 + 6.0 Test Bot 11/26 (run 45735552433)
          # Second provider (Nebius Token Factory, OpenAI-compatible) for after the Claude
          # credit ends. Inactive while PROVIDER_SWITCH_AT is empty; set it (and LOOP_UNTIL)
          # only after a Test Bot run on this provider has passed. Own ledger, cap and cutoff.
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          PROVIDER_SWITCH_AT: ""
          FORECAST_ENSEMBLE_OC: "moonshotai/Kimi-K3:3"
          RESEARCH_MODEL_OC: zai-org/GLM-5.3
          PARSER_MODEL_OC: zai-org/GLM-5.3-Flash
          SPEND_CAP_USD_OC: "70" # live posting; the re-forecast experiment has its own $25 (total Nebius <= $95, balance $110.99 on 11/20)
          RUN_CAP_USD_OC: "8"
          LLM_KEY_EXPIRES_OC: "2026-12-24T00:00:00Z"
          SPEND_OFFSET_USD_OC: "21.2" # Test Bot runs outside the ledger (11/19): 4.49 + 5.38 + 1.4 timeouts + 4.87 + 4.94
          LLM_PROVIDER: ${{ inputs.provider }}
          # Probability limits (user-approved 11/26): binary 2%-98%, every multiple-choice
          # option at least 1%.
          BINARY_PROB_MIN: "0.02"
          BINARY_PROB_MAX: "0.98"
          MC_PROB_MIN: "0.01"
          # Multiple-choice answers carry the option names (daily check 11/27).
          MC_NAMED_OPTIONS: "1"
          # MiniBench profile, same values as bot_loop.yaml but active at once so a test
          # can exercise it before 11/28. The test never saves a ledger.
          CONFIG_PROFILE: ${{ inputs.profile }}
          PROFILE_FROM_MB: "2026-11-01T00:00:00Z"
          SPEND_LEDGER_MB: spend/ledger_mb.json
          SPEND_CAP_USD_MB: "75"
          SPEND_OFFSET_USD_MB: "0"
          RUN_CAP_USD_MB: "12"
          LLM_KEY_EXPIRES_MB: "2026-12-25T04:00:00Z"
          PROVIDER_SWITCH_AT_MB: "2026-12-25T04:00:00Z"
          SWITCH_ON_CAP_MB: "1"
          FORECAST_ENSEMBLE_MB: "claude-opus-5-5:3"
          RESEARCH_MAX_SEARCHES_MB: "5"
          RESEARCH_FETCH_MAX_TOKENS_MB: "6000"
      - name: Show spend
        if: always()
        run: |
          for f in spend/ledger*.json; do
            [ -f "$f" ] || continue; python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1],'total',d['total_usd']);print(d['runs'][-1])" "$f" | tee -a $GITHUB_STEP_SUMMARY
          done
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
