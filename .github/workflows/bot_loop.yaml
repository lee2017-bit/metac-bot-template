name: Forecast loop (self-restarting)

# Backup for the 20-minute schedule, which GitHub was not firing on this fork.
# One job checks for new questions every 15 minutes for ~55 minutes, then
# starts the next job itself. It stops chaining after LLM_KEY_EXPIRES.
on:
  workflow_dispatch:

concurrency:
  group: forecast-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # only to start the next loop job

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Bot-only cap. The organisation also has a Console monthly limit of $180 for all
      # usage (about $35 of it was spent before the bot existed), so the bot stops
      # a little before that limit would start rejecting calls.
      SPEND_CAP_USD: "140"
      RUN_CAP_USD: "15"
      LLM_KEY_EXPIRES: "2026-11-27T15:00:00Z" # = 11/28 00:00 KST
      FORECAST_ENSEMBLE: "claude-fable-5-2:2,claude-opus-5-5:3"
      FORECAST_EFFORT: high
      PARSER_MODEL: anthropic/claude-haiku-5-5
      RESEARCHER: claude-web-search
      RESEARCH_MODEL: claude-sonnet-5-5
      RESEARCH_EFFORT: high
      RESEARCH_MAX_SEARCHES: "6"
      RESEARCH_SEARCH_TOOL: web_search_20250305
      # Upgrades, on since 2026-11-18 after the bot-testing-area run 44228063460 (0 = off).
      RESEARCH_FULL_CONTEXT: "1"
      RESEARCH_MAX_FETCHES: "3"
      RESEARCH_MAX_MARKET_LOOKUPS: "2"
      DISCRETE_PER_VALUE_MAX: "35"
      # Spend outside the ledger (local tests, parallel test runs), counted against the cap.
      SPEND_OFFSET_USD: "22.3" # 9.6 tests outside the ledger + 12.7 gap vs Console on 11/18
      # Second provider (Nebius Token Factory, OpenAI-compatible) for after the Claude
      # credit ends. Switch on since 11/20 (user decision) after four bot-testing-area runs
      # (last: 44563140633, 10/10, no errors). Own ledger, cap and cutoff.
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      PROVIDER_SWITCH_AT: "2026-11-27T15:00:00Z" # = 11/28 00:00 KST, when the Claude cutoff passes
      FORECAST_ENSEMBLE_OC: "moonshotai/Kimi-K3:3"
      RESEARCH_MODEL_OC: zai-org/GLM-5.3
      PARSER_MODEL_OC: zai-org/GLM-5.3-Flash
      SPEND_CAP_USD_OC: "80" # Nebius balance was $128 on 11/19; stays well below it
      RUN_CAP_USD_OC: "8"
      LLM_KEY_EXPIRES_OC: "2026-12-24T00:00:00Z"
      SPEND_OFFSET_USD_OC: "21.2" # Test Bot runs outside the ledger (11/19): 4.49 + 5.38 + 1.4 timeouts + 4.87 + 4.94
      # The loop keeps restarting itself until this time (LLM_KEY_EXPIRES if empty).
      LOOP_UNTIL: "2026-12-24T00:00:00Z" # = LLM_KEY_EXPIRES_OC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - name: Restore spend ledger
        uses: actions/cache/restore@v4
        with:
          path: spend
          key: spend-ledger-${{ github.run_id }}
          restore-keys: spend-ledger-
      - name: Forecast every 15 minutes
        run: |
          end=$(( $(date +%s) + 55*60 ))
          while [ $(date +%s) -lt $end ]; do
            echo "=== check at $(date -u +%FT%TZ) ==="
            uv run python main.py || echo "run failed (exit $?)"
            for f in spend/ledger*.json; do [ -f "$f" ] || continue; python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1],'total',d['total_usd'],d['runs'][-1])" "$f"; done
            now=$(date +%s); [ $((now + 15*60)) -gt $end ] && break
            sleep 900
          done
      - name: Show spend
        if: always()
        run: |
          for f in spend/ledger*.json; do
            [ -f "$f" ] || continue; python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1],'total',d['total_usd']);print(d['runs'][-1])" "$f" | tee -a $GITHUB_STEP_SUMMARY
          done
      - name: Save spend ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: spend
          key: spend-ledger-${{ github.run_id }}
      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 90
      - name: Start next loop job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -c "import datetime as d,os,sys;sys.exit(0 if d.datetime.now(d.timezone.utc)<d.datetime.fromisoformat((os.environ.get('LOOP_UNTIL') or os.environ['LLM_KEY_EXPIRES']).replace('Z','+00:00')) else 1)"; then
            gh workflow run bot_loop.yaml --ref main
          else
            echo "Past cutoff; not restarting."
          fi
