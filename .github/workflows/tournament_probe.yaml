name: Tournament probe (read-only)

on:
  workflow_dispatch:

concurrency:
  group: probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: python tools/tournament_probe2.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          POST_IDS: "46477,46478,46497,46505,46561,46562,46563,46564,46565,46566,46567,46568,46569,46570,46571,46572,46573,46574,46575,46576,46577,46578,46579,46580,46581,46582,46583,46584,46585,46586,46587,46588,46589,46590,46591,46592,46593,46594,46595,46596,46597,46598,46599,46600,46601,46607,46608"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ github.run_id }}
          path: probe2.json
          if-no-files-found: ignore
          retention-days: 30
